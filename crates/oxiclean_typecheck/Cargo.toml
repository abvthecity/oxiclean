[package]
name = "oxiclean_typecheck"
description = "Finds tsconfig and lint setups that make tsc and typed linting slower than they need to be"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
clap.workspace = true
dashmap.workspace = true
globset.workspace = true
ignore.workspace = true
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_isolated_declarations.workspace = true
oxc_parser.workspace = true
oxc_span.workspace = true
oxiclean_core = { version = "0.1.0", path = "../oxiclean_core", features = ["cli"] }
path-clean.workspace = true
rayon.workspace = true
serde_json.workspace = true
tracing.workspace = true

[lib]
name = "oxiclean_typecheck"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3.10"

[lints]
workspace = true
