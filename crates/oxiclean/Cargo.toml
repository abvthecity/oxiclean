[package]
name = "oxiclean"
description = "Static analysis CLI that finds import bloat and deep import chains in JavaScript/TypeScript projects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
anyhow.workspace = true
clap.workspace = true
colored.workspace = true
oxiclean_core = { version = "0.1.0", path = "../oxiclean_core", features = ["cli"] }
oxiclean_bloat = { version = "0.1.0", path = "../oxiclean_bloat" }
oxiclean_cycles = { version = "0.1.0", path = "../oxiclean_cycles" }
oxiclean_dependencies = { version = "0.1.0", path = "../oxiclean_dependencies" }
oxiclean_duplicates = { version = "0.1.0", path = "../oxiclean_duplicates" }
oxiclean_unused_exports = { version = "0.1.0", path = "../oxiclean_unused_exports" }
oxiclean_depth = { version = "0.1.0", path = "../oxiclean_depth" }
oxiclean_typecheck = { version = "0.1.0", path = "../oxiclean_typecheck" }
rayon.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Validates SARIF output against the vendored schema; no network access needed.
jsonschema = { version = "0.58", default-features = false }
serde_json.workspace = true
tempfile = "3.10"

[[bin]]
name = "oxiclean"
path = "src/main.rs"

[lints]
workspace = true
