[package]
name = "oxiclean"
description = "Static analysis CLI that finds import bloat and deep import chains in JavaScript/TypeScript projects"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
anyhow.workspace = true
clap.workspace = true
colored.workspace = true
oxiclean_core = { version = "0.1.0", path = "../oxiclean_core", features = ["cli"] }
oxiclean_import_bloat = { version = "0.1.0", path = "../oxiclean_import_bloat" }
oxiclean_import_cycles = { version = "0.1.0", path = "../oxiclean_import_cycles" }
oxiclean_import_depth = { version = "0.1.0", path = "../oxiclean_import_depth" }
rayon.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile = "3.10"

[[bin]]
name = "oxiclean"
path = "src/main.rs"

[lints]
workspace = true
