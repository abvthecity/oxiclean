[package]
name = "oxiclean_lint"
description = "Finds ESLint and oxlint setups that make linting slower than it needs to be"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
clap.workspace = true
globset.workspace = true
ignore.workspace = true
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_parser.workspace = true
oxc_span.workspace = true
oxiclean_core = { version = "0.1.0", path = "../oxiclean_core", features = ["cli"] }
oxiclean_typecheck = { version = "0.1.0", path = "../oxiclean_typecheck" }
serde_json.workspace = true
tracing.workspace = true

[lib]
name = "oxiclean_lint"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3.10"

[lints]
workspace = true
