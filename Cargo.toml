[workspace]
resolver = "2"

members = [
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Edition 2024 and let-chains need 1.88; the oxc crates need 1.89.
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/abvthecity/oxiclean"
keywords = ["typescript", "javascript", "static-analysis", "bundle-size", "monorepo"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
dashmap = "6.1"
globset = "0.4.18"
ignore = "0.4.25"
oxc_allocator = "0.97.0"
oxc_ast = "0.97.0"
oxc_ast_visit = "0.97.0"
oxc_parser = "0.97.0"
oxc_semantic = "0.97.0"
oxc_span = "0.97.0"
oxc_syntax = "0.97.0"
path-clean = "1.0.1"
rayon = "1.10"
schemars = "1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Diagnostics go through `tracing`; the report is written to an explicit
# `impl Write`. See clippy.toml for the banned `log` macros.
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
